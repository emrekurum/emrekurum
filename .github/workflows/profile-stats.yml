name: Refresh GitHub profile stats

on:
  push:
    branches: [main]
    paths: [.github/workflows/profile-stats.yml]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&hide_border=true&hide_rank=true
          path: profile/stats.svg
          fail_on_error: 'true'

      - name: Generate public repository language stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dracula&hide_border=true&custom_title=Languages%20in%20public%20repositories
          path: profile/top-langs.svg
          fail_on_error: 'true'

      - name: Publish both SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree

          for path in ('profile/stats.svg', 'profile/top-langs.svg'):
              if ElementTree.parse(path).getroot().tag != '{http://www.w3.org/2000/svg}svg':
                  raise SystemExit(f'{path} is not an SVG')
          PY
          git add -- profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh GitHub profile stats'
          git push origin HEAD:main
